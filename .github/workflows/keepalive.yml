name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" js/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" js/config.js)
          curl -fsS "$URL/rest/v1/faculty?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
